services:
  - type: web
    name: beskar-shelf
    runtime: node
    buildCommand: npm ci && npm run build
    startCommand: node server.js
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_APP_NAME
        value: Beskar Shelf
      - key: VITE_ABS_PROXY_BASE
        value: /abs
      - key: VITE_DEFAULT_SERVER_URL
        sync: false
      - key: ABS_UPSTREAM
        sync: false
      - key: ANALYTICS_SCRIPT
        sync: false
